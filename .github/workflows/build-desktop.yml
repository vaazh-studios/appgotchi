name: Build desktop app

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - name: Unit tests
        run: ./gradlew :core:data:jvmTest :core:apple:jvmTest :core:play:jvmTest :shared:jvmTest --stacktrace
      - name: Desktop debug build
        run: ./gradlew :desktopApp:assemble --stacktrace
