<!doctype html>
<html lang="en" class="bg-white antialiased">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Appgotchi — Connect a store (prototype)</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: InterVariable, ui-sans-serif, system-ui, sans-serif;
        --font-sans--font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
    </style>
  </head>
  <body class="font-sans text-zinc-950">
    <div class="isolate flex min-h-dvh flex-col">
      <header class="border-b border-zinc-950/5">
        <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
          <p class="flex items-center gap-2 text-base/7 font-semibold sm:text-sm/6">
            <span class="size-2.5 shrink-0 rounded-full bg-lime-500" aria-hidden="true"></span>
            Appgotchi
          </p>
          <div class="flex rounded-lg bg-zinc-950/5 p-0.5" role="tablist" aria-label="Store">
            <button type="button" role="tab" data-store="apple" class="store-tab rounded-md px-3 py-1.5 text-base/6 font-medium sm:py-1 sm:text-sm/6">App Store</button>
            <button type="button" role="tab" data-store="play" class="store-tab rounded-md px-3 py-1.5 text-base/6 font-medium sm:py-1 sm:text-sm/6">Google Play</button>
          </div>
        </div>
      </header>

      <main class="flex-1">
        <div class="mx-auto flex max-w-md flex-col gap-8 px-4 py-10 sm:py-16">
          <div class="flex flex-col gap-3">
            <div class="flex gap-1.5" id="focus-progress" aria-hidden="true"></div>
            <p class="text-base/7 text-zinc-500 tabular-nums sm:text-sm/6" id="focus-counter"></p>
          </div>
          <div class="flex flex-col gap-6" id="focus-body"></div>
          <div class="flex items-center justify-between gap-3" id="focus-footer"></div>
          <p class="trust-note"></p>
        </div>
      </main>
    </div>

    <script>
      const icon = {
        external:
          '<svg viewBox="0 0 16 16" class="size-4 h-lh shrink-0 fill-current" aria-hidden="true"><path d="M6.22 8.72a.75.75 0 0 0 1.06 1.06l5.22-5.22v1.69a.75.75 0 0 0 1.5 0v-3.5a.75.75 0 0 0-.75-.75h-3.5a.75.75 0 0 0 0 1.5h1.69L6.22 8.72Z"/><path d="M3.5 6.75c0-.69.56-1.25 1.25-1.25H7A.75.75 0 0 0 7 4H4.75A2.75 2.75 0 0 0 2 6.75v4.5A2.75 2.75 0 0 0 4.75 14h4.5A2.75 2.75 0 0 0 12 11.25V9a.75.75 0 0 0-1.5 0v2.25c0 .69-.56 1.25-1.25 1.25h-4.5c-.69 0-1.25-.56-1.25-1.25v-4.5Z"/></svg>',
        upload:
          '<svg viewBox="0 0 16 16" class="size-4 shrink-0 fill-zinc-500" aria-hidden="true"><path d="M7.25 10.25a.75.75 0 0 0 1.5 0V4.56l2.22 2.22a.75.75 0 1 0 1.06-1.06l-3.5-3.5a.75.75 0 0 0-1.06 0l-3.5 3.5a.75.75 0 0 0 1.06 1.06l2.22-2.22v5.69Z"/><path d="M3.5 9.75a.75.75 0 0 0-1.5 0v1.5A2.75 2.75 0 0 0 4.75 14h6.5A2.75 2.75 0 0 0 14 11.25v-1.5a.75.75 0 0 0-1.5 0v1.5c0 .69-.56 1.25-1.25 1.25h-6.5c-.69 0-1.25-.56-1.25-1.25v-1.5Z"/></svg>',
        check:
          '<svg viewBox="0 0 16 16" class="size-4 shrink-0 fill-current" aria-hidden="true"><path fill-rule="evenodd" d="M12.416 3.376a.75.75 0 0 1 .208 1.04l-5 7.5a.75.75 0 0 1-1.154.114l-3-3a.75.75 0 0 1 1.06-1.06l2.353 2.353 4.493-6.74a.75.75 0 0 1 1.04-.207Z" clip-rule="evenodd"/></svg>',
        checkCircle:
          '<svg viewBox="0 0 16 16" class="size-4 h-lh shrink-0 fill-lime-600" aria-hidden="true"><path fill-rule="evenodd" d="M8 15A7 7 0 1 0 8 1a7 7 0 0 0 0 14Zm3.844-8.791a.75.75 0 0 0-1.188-.918l-3.7 4.79-1.649-1.833a.75.75 0 1 0-1.114 1.004l2.25 2.5a.75.75 0 0 0 1.15-.043l4.25-5.5Z" clip-rule="evenodd"/></svg>',
        copy:
          '<svg viewBox="0 0 16 16" class="size-4 shrink-0 fill-current" aria-hidden="true"><path d="M5.5 3.5A1.5 1.5 0 0 1 7 2h2.879a1.5 1.5 0 0 1 1.06.44l2.122 2.12a1.5 1.5 0 0 1 .439 1.061V9.5A1.5 1.5 0 0 1 12 11V8.621a3 3 0 0 0-.879-2.121L9 4.379A3 3 0 0 0 6.879 3.5H5.5Z"/><path d="M4 5a1.5 1.5 0 0 0-1.5 1.5v6A1.5 1.5 0 0 0 4 14h5a1.5 1.5 0 0 0 1.5-1.5V8.621a1.5 1.5 0 0 0-.44-1.06L7.94 5.439A1.5 1.5 0 0 0 6.878 5H4Z"/></svg>',
        lock:
          '<svg viewBox="0 0 16 16" class="size-4 h-lh shrink-0 fill-zinc-400" aria-hidden="true"><path fill-rule="evenodd" d="M8 1a3.5 3.5 0 0 0-3.5 3.5V7A1.5 1.5 0 0 0 3 8.5v5A1.5 1.5 0 0 0 4.5 15h7a1.5 1.5 0 0 0 1.5-1.5v-5A1.5 1.5 0 0 0 11.5 7V4.5A3.5 3.5 0 0 0 8 1Zm2 6V4.5a2 2 0 1 0-4 0V7h4Z" clip-rule="evenodd"/></svg>',
        doc:
          '<svg viewBox="0 0 16 16" class="size-4 h-lh shrink-0 fill-zinc-500" aria-hidden="true"><path fill-rule="evenodd" d="M4 2a1.5 1.5 0 0 0-1.5 1.5v9A1.5 1.5 0 0 0 4 14h8a1.5 1.5 0 0 0 1.5-1.5V6.621a1.5 1.5 0 0 0-.44-1.06L9.94 2.439A1.5 1.5 0 0 0 8.878 2H4Zm1 5.75A.75.75 0 0 1 5.75 7h4.5a.75.75 0 0 1 0 1.5h-4.5A.75.75 0 0 1 5 7.75Zm0 3a.75.75 0 0 1 .75-.75h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1-.75-.75Z" clip-rule="evenodd"/></svg>',
        back:
          '<svg viewBox="0 0 16 16" class="size-4 shrink-0 fill-current" aria-hidden="true"><path fill-rule="evenodd" d="M9.78 4.22a.75.75 0 0 1 0 1.06L7.06 8l2.72 2.72a.75.75 0 1 1-1.06 1.06L5.47 8.53a.75.75 0 0 1 0-1.06l3.25-3.25a.75.75 0 0 1 1.06 0Z" clip-rule="evenodd"/></svg>',
      }

      const cls = {
        primary:
          'inline-flex items-center justify-center gap-2 rounded-lg bg-zinc-950 px-3 py-2.5 text-base/6 font-medium text-white hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-lime-600 disabled:bg-zinc-950/20 sm:py-2 sm:text-sm/6',
        secondary:
          'inline-flex items-center gap-1.5 rounded-lg py-2 pr-2 pl-2.5 text-base/6 font-medium text-zinc-950 ring-1 ring-zinc-950/10 hover:bg-zinc-950/5 sm:py-1.5 sm:text-sm/6',
        ghost:
          'inline-flex items-center gap-1 rounded-lg py-2 pr-2.5 pl-1.5 text-base/6 font-medium text-zinc-600 hover:bg-zinc-950/5 sm:py-1.5 sm:text-sm/6',
      }

      const flows = {
        apple: {
          name: 'App Store Connect',
          title: 'Connect App Store Connect',
          intro: 'Three quick steps. You need Admin or Account Holder access to create a team key.',
          verify: 'Verify and connect',
          steps: [
            {
              title: 'Create a team key',
              short: 'Create a team key',
              body: 'In App Store Connect, open Users and Access, then Integrations. Generate a team key with the App Manager role. Apple lets you download it only once.',
              links: [{ label: 'Open Team Keys', href: 'https://appstoreconnect.apple.com/access/integrations/api' }],
            },
            {
              title: 'Add your AuthKey file',
              short: 'Add the .p8 file',
              body: 'Drop the .p8 file you downloaded. Keep its original name so Appgotchi can read the Key ID.',
              file: { accept: '.p8', sample: 'AuthKey_7XK2M9Q4TB.p8' },
            },
            {
              title: 'Paste your Issuer ID',
              short: 'Add the Issuer ID',
              body: 'It is shown above the keys list on the same page. The Issuer ID is not secret.',
              input: { label: 'Issuer ID', placeholder: '57246542-96fe-1a63-e053-…' },
            },
          ],
        },
        play: {
          name: 'Google Play',
          title: 'Connect Google Play',
          intro: 'Appgotchi signs in with a read-only service account that you create and control.',
          verify: 'Verify access',
          steps: [
            {
              title: 'Create a service account',
              short: 'Create a service account',
              body: 'In Google Cloud, enable the Play Developer Reporting API. Then create a service account and download a JSON key for it.',
              links: [
                { label: 'Enable the API', href: 'https://console.cloud.google.com/apis/library/playdeveloperreporting.googleapis.com' },
                { label: 'Service accounts', href: 'https://console.cloud.google.com/iam-admin/serviceaccounts' },
              ],
            },
            {
              title: 'Add the JSON key',
              short: 'Add the JSON key',
              body: 'Drop the JSON key file. Appgotchi shows the account email so you can invite it next.',
              file: { accept: '.json', sample: 'appgotchi-readonly-4f2a9c.json' },
            },
            {
              title: 'Invite it in Play Console',
              short: 'Invite in Play Console',
              body: 'Invite the email below under Users and permissions with View app information (read-only). New permissions can take a few hours to apply.',
              links: [{ label: 'Open Play Console', href: 'https://play.google.com/console/u/0/developers' }],
              email: true,
            },
          ],
        },
      }

      const state = { store: 'apple', step: 0, file: { apple: null, play: null }, issuer: '', status: 'idle' }
      const sampleEmail = 'appgotchi-readonly@your-project.iam.gserviceaccount.com'
      const flow = () => flows[state.store]
      const keyIdFrom = (name) => (name.match(/^AuthKey_([A-Z0-9]+)\.p8$/) || [])[1]

      function link(l) {
        return `<a href="${l.href}" target="_blank" rel="noreferrer" class="${cls.secondary}">${l.label}${icon.external}</a>`
      }

      function fileBlock(s) {
        const name = state.file[state.store]
        if (name) {
          const keyId = state.store === 'apple' ? keyIdFrom(name) : null
          return `
            <div class="flex items-start gap-3 rounded-lg bg-zinc-950/2.5 p-3 ring-1 ring-zinc-950/5">
              ${icon.doc}
              <div class="flex min-w-0 flex-1 flex-col gap-0.5">
                <p class="truncate text-base/6 font-medium sm:text-sm/6">${name}</p>
                <p class="text-base/6 text-zinc-500 sm:text-sm/6">${
                  state.store === 'apple'
                    ? keyId
                      ? `Key ID <span class="font-mono text-zinc-950">${keyId}</span> read from the file name.`
                      : 'Could not read a Key ID from this name. Enter it below.'
                    : 'Service account key added.'
                }</p>
              </div>
              <button type="button" class="${cls.ghost}" data-action="remove">Remove</button>
            </div>
            ${state.store === 'play' ? emailBlock() : ''}`
        }
        return `
          <label class="group flex cursor-pointer flex-col items-center gap-3 rounded-xl border border-dashed border-zinc-950/15 px-6 py-10 text-center hover:bg-zinc-950/2.5 has-focus-visible:outline-2 has-focus-visible:outline-lime-600" data-drop>
            ${icon.upload}
            <span class="flex flex-col gap-1">
              <span class="text-base/6 font-medium sm:text-sm/6">Drop the ${s.file.accept} file here</span>
              <span class="text-base/6 text-zinc-500 sm:text-sm/6">or choose it from your files</span>
            </span>
            <input type="file" name="key-file" accept="${s.file.accept}" class="sr-only" data-file />
          </label>
          <button type="button" class="${cls.ghost} self-start" data-action="sample">Use a sample file</button>`
      }

      function emailBlock() {
        return `
          <div class="flex items-center gap-3 rounded-lg p-3 ring-1 ring-zinc-950/10">
            <p class="min-w-0 flex-1 truncate font-mono text-base/6 sm:text-sm/6">${sampleEmail}</p>
            <button type="button" class="${cls.secondary}" data-action="copy">${icon.copy}<span>Copy</span></button>
          </div>`
      }

      function stepContent(s, { withHeading = true } = {}) {
        let html = ''
        if (withHeading) {
          html += `<div class="flex flex-col gap-2">
            <h1 class="text-2xl font-semibold tracking-tight text-balance">${s.title}</h1>
            <p class="max-w-[56ch] text-base/7 text-pretty text-zinc-600 sm:text-sm/6">${s.body}</p>
          </div>`
        }
        if (s.links) html += `<div class="flex flex-wrap gap-2">${s.links.map(link).join('')}</div>`
        if (s.file) html += `<div class="flex flex-col gap-3">${fileBlock(s)}</div>`
        if (s.email) html += state.file.play ? emailBlock() : `<p class="text-base/6 text-zinc-500 sm:text-sm/6">Add the JSON key first to see the email.</p>`
        if (s.input)
          html += `<div class="flex max-w-sm flex-col gap-2">
            <label for="issuer-${s.input.label}" class="text-base/6 font-medium sm:text-sm/6">${s.input.label}</label>
            <input id="issuer-${s.input.label}" name="issuer-id" value="${state.issuer}" placeholder="${s.input.placeholder}" autocomplete="off" spellcheck="false" data-issuer
              class="rounded-lg bg-white px-3 py-2 font-mono text-base/6 ring-1 ring-zinc-950/10 placeholder:text-zinc-400 focus:outline-2 focus:-outline-offset-1 focus:outline-lime-600 sm:py-1.5 sm:text-sm/6" />
          </div>`
        return html
      }

      function statusBlock() {
        if (state.status === 'verifying')
          return `<p class="text-base/6 text-zinc-500 sm:text-sm/6">Checking with ${flow().name}…</p>`
        if (state.status === 'connected')
          return `<p class="flex items-start gap-2 text-base/6 text-zinc-950 sm:text-sm/6">${icon.checkCircle}<span>Connected. Appgotchi found 2 apps.</span></p>`
        if (state.status === 'waiting')
          return `<div class="flex flex-col gap-3 rounded-lg bg-amber-50 p-3 text-base/6 text-amber-900 ring-1 ring-amber-600/20 sm:text-sm/6">
            <p>The key works, but Google has not applied the Play Console permissions yet. This can take a few hours, so check again later.</p>
          </div>`
        return ''
      }

      function canVerify() {
        return state.file[state.store] && (state.store === 'play' || state.issuer.trim())
      }

      function footer(isLast) {
        const backBtn =
          state.step > 0
            ? `<button type="button" class="${cls.ghost}" data-action="back">${icon.back}<span>Back</span></button>`
            : '<span></span>'
        const next = isLast
          ? `<button type="button" class="${cls.primary}" data-action="verify" ${canVerify() ? '' : 'disabled'}>${state.status === 'waiting' ? 'Check again' : flow().verify}</button>`
          : `<button type="button" class="${cls.primary}" data-action="next" ${flow().steps[state.step].file && !state.file[state.store] ? 'disabled' : ''}>Continue</button>`
        return backBtn + next
      }

      function renderFocus() {
        const f = flow()
        const s = f.steps[state.step]
        document.getElementById('focus-progress').innerHTML = f.steps
          .map((_, i) => `<span class="h-1 flex-1 rounded-full ${i <= state.step ? 'bg-zinc-950' : 'bg-zinc-950/10'}"></span>`)
          .join('')
        document.getElementById('focus-counter').textContent = `${f.name} · Step ${state.step + 1} of ${f.steps.length}`
        document.getElementById('focus-body').innerHTML = stepContent(s) + statusBlock()
        document.getElementById('focus-footer').innerHTML = footer(state.step === f.steps.length - 1)
      }



      function render() {
        document.querySelectorAll('.store-tab').forEach((t) => {
          const on = t.dataset.store === state.store
          t.setAttribute('aria-selected', on)
          t.className = `store-tab rounded-md px-3 py-1.5 text-base/6 font-medium sm:py-1 sm:text-sm/6 ${on ? 'bg-white text-zinc-950 shadow-xs ring-1 ring-zinc-950/5' : 'text-zinc-600 hover:text-zinc-950'}`
        })
        document.querySelectorAll('.trust-note').forEach((p) => {
          p.className = 'trust-note flex items-start gap-2 text-base/6 text-zinc-500 sm:text-sm/6'
          p.innerHTML = `${icon.lock}<span>Stored in this device’s secure storage. Only ever sent to ${state.store === 'apple' ? 'Apple' : 'Google'}.</span>`
        })
        renderFocus()
      }

      document.addEventListener('click', (e) => {
        const tab = e.target.closest('.store-tab')
        if (tab) Object.assign(state, { store: tab.dataset.store, step: 0, status: 'idle' })
        const a = e.target.closest('[data-action]')?.dataset.action
        if (a === 'next') state.step = Math.min(state.step + 1, flow().steps.length - 1)
        if (a === 'back') state.step = Math.max(state.step - 1, 0)
        if (a === 'sample') state.file[state.store] = flow().steps.find((s) => s.file).file.sample
        if (a === 'remove') state.file[state.store] = null
        if (a === 'copy') navigator.clipboard?.writeText(sampleEmail)
        if (a === 'verify') {
          // Prototype: Play's first check shows the "permissions not applied yet" state; retrying connects
          const retrying = state.status === 'waiting'
          state.status = 'verifying'
          render()
          setTimeout(() => {
            state.status = state.store === 'play' && !retrying ? 'waiting' : 'connected'
            render()
          }, 900)
          return
        }
        if (tab || a) render()
      })
      document.addEventListener('input', (e) => {
        if (e.target.matches('[data-issuer]')) {
          state.issuer = e.target.value
          document.querySelectorAll('[data-action="verify"]').forEach((b) => (b.disabled = !canVerify()))
        }
      })
      // Prototype only: uses the file NAME, never reads the file's contents
      document.addEventListener('change', (e) => {
        if (e.target.matches('[data-file]') && e.target.files[0]) {
          state.file[state.store] = e.target.files[0].name
          render()
        }
      })
      document.addEventListener('dragover', (e) => e.target.closest('[data-drop]') && e.preventDefault())
      document.addEventListener('drop', (e) => {
        if (!e.target.closest('[data-drop]')) return
        e.preventDefault()
        const f = e.dataTransfer.files[0]
        if (f) {
          state.file[state.store] = f.name
          render()
        }
      })
      render()
    </script>
  </body>
</html>
